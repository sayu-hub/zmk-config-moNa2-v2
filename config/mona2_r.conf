#Mouse config ---------------------
# cormoran/zmk-driver-pmw3610-with-custom-studio-rpc を使用。
# 軸の向きは devicetree ではなくここで指定する (DYA Studio から実行時変更も可)。
CONFIG_PMW3610_INVERT_X=y
# CONFIG_PMW3610_INVERT_Y=y  # この個体ではY軸は反転不要
# CONFIG_PMW3610_SWAP_XY=y
# CONFIG_PMW3610_REPORT_INTERVAL_MIN=12
# CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300 // <--see Troubleshooting

# トラックボールセンサー診断 (DYA Studio の「トラックボールセンサー」タブ)
CONFIG_ZMK_PMW3610_STUDIO_RPC=y
# CPI / 軸反転 / ダウンシフト時間などを DYA Studio から保存できるようにする
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y

#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y

#ZMK Studio config -------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

#DYA Studio modules ------------------
# Custom Settings (設定永続化の共通基盤)
# runtime-input-processor / runtime-combo / runtime-macro がこの上に乗る
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
# ランタイムマクロ本体 (最大256バイト) を保存できるようにする
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# Settings RPC (注: サブフラグは _STUDIO_RPC ではなく _STUDIO)
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# Battery History は無効 (使わない)
# CONFIG_ZMK_BATTERY_HISTORY=y
# CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y

# BLE Management
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# Runtime Input Processor (トラックボール用)
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# Runtime Sensor Rotate (エンコーダ用)
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# Runtime Combo (DYA Studio からコンボを追加・編集・削除)
# https://github.com/cormoran/zmk-feature-runtime-combo
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
# スロット数。1スロットあたり RAM 約64バイト (16スロットで約1KB)
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=16
# 旧 zmk,combos のデフォルト (50ms) に合わせる
CONFIG_ZMK_RUNTIME_COMBO_DEFAULT_TIMEOUT_MS=50

# Runtime Macro (DYA Studio からマクロを作成・編集・削除)
# https://github.com/cormoran/zmk-feature-runtime-macro
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
# ランタイムマクロは behavior local ID で束縛を保存するため CRC16 が必要
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
# 同時に存在できるマクロ数 (キーマップ側の &rmacro <slot> の上限)
CONFIG_ZMK_RUNTIME_MACRO_COUNT=8
# 全マクロで共有する name+body プール
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=1024
CONFIG_ZMK_RUNTIME_MACRO_MAX_BYTES=256

# Mouse Gesture RPC (DYA Studioから動的設定)
CONFIG_ZMK_MOUSE_GESTURE_RPC=y

# Kscan Diagnostics (DYA Studio の「キースイッチ」タブ)
# https://github.com/cormoran/zmk-feature-kscan-diagnostics
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
# 42キーなのでデフォルト128から縮めて RAM を節約 (1ポジションあたり約28バイト)
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
# 分割キーボードで周辺側 (左手) の統計も取得するための中継。
# 左右両方で CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256 を揃える必要がある。
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256

# Input Stream (キースイッチ診断のライブ表示)
# https://github.com/cormoran/zmk-feature-input-stream
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y

# Devtool (DYA Studio の「スタック使用量」タブ)
# https://github.com/cormoran/zmk-module-devtool
CONFIG_ZMK_DEVTOOL=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL_STACK_USAGE=y
# ログキャプチャは RAM を数KB消費するので既定では無効
# CONFIG_ZMK_DEVTOOL_LOG_CAPTURE=y

# Device Info (DYA Studio の「デバイス情報」タブ)
# https://github.com/cormoran/zmk-feature-device-info
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y

# Watchdog (DYA Studio の「安定性(ウォッチドッグ)」タブ)
# https://github.com/cormoran/zmk-feature-watchdog
# フリーズ・ハードフォルト・予期しないリセットを Flash に記録して一覧表示する。
# NOTE: FREEZE_DETECT はシステムワークキューが 10 秒以上詰まると
#       インシデントを記録して再起動する (デフォルト有効)。
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

# Zephyr Settings の閲覧 (DYA Studio の設定一覧)
# https://github.com/cormoran/zmk-feature-zephyr-setting-expose
CONFIG_ZMK_SETTING_EXPOSE=y

# Studio RPC の性能計測
# https://github.com/cormoran/zmk-feature-studio-rpc-perf
CONFIG_ZMK_STUDIO_RPC_PERF=y
CONFIG_ZMK_STUDIO_RPC_PERF_HANDLER=y

# OS ごとのデフォルトレイヤー (DYA Studio の「OSごとのデフォルトレイヤー」)
# https://github.com/cormoran/zmk-feature-default-layer
# mona2 のベースレイヤーは 0=WIN / 1=MAC なので、選択可能範囲を 0..1 にする。
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=1
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y

# OS 判定 (デフォルトレイヤーの OS 連動に必要)
# https://github.com/cormoran/zmk-feature-os-detection
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y
# NOTE: os-detection 自身の CONFIG_ZMK_OS_DETECTION_LAYER_* による自動切替は
#       default-layer モジュールと競合するので有効にしないこと。

#Bluetooth config -------------------
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# ── USB polling rate ──
CONFIG_USB_HID_POLL_INTERVAL_MS=1

# Phase 2: rebuild trigger

# Phase 3: rebuild trigger

# Phase 3 retry

# Phase 4 trigger

# Phase 5 retry

# Studio RPC buffer sizes
# 2048-byte buffers made Studio keymap loading freeze with 5+ layers on nRF52840.
# Keep buffers moderate so keymap RPC and mouse gesture RPC can coexist.
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=512

# Custom RPC payload size for our mouse_gesture subsystem
# (runtime-combo は 96B, runtime-macro は 192B あれば足りるので 512 で両立できる)
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=512

# ── Custom RPC を増やしたことによるスタック調整 ──
# 大きな通知ボディをエンコードする際のスタックオーバーフロー対策。
# cormoran/zmk-keyboard-dya2 v2.0 の dya2_right.conf と同じ値。
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000

# 編集直後の電源断でも設定が消えにくいよう、フラッシュ書き込みまでの
# デバウンスを短縮する (トレードオフ: フラッシュ書き込み回数が増える)
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
