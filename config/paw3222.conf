# Selects PAW3222 sensor variant for the mona2 trackball.
# Used via build.yaml: cmake-args: -DEXTRA_CONF_FILE=../../config/paw3222.conf
# Switches the trackball_central node compatible to pixart,paw3222
# (see mona2_r.overlay #ifdef CONFIG_TRACKBALL_PAW3222).
#
# Both PMW3610 and PAW3222 drivers compile by default (Kconfig.defconfig),
# so this conf only needs to flip the TRACKBALL_PAW3222 flag.

CONFIG_TRACKBALL_PAW3222=y

# Trackball no-response fix (PAW3222 build only).
# paw3222 driver calls pm_device_runtime_enable at end of init;
# with runtime PM on, the sensor stays suspended and never wakes,
# so disable it for this build.
CONFIG_PM_DEVICE_RUNTIME=n
