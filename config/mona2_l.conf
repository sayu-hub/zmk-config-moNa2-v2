#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_OWN_THREAD=y
CONFIG_EC11_THREAD_PRIORITY=7
CONFIG_EC11_THREAD_STACK_SIZE=2048

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#Kscan Diagnostics ----------------
# 周辺側 (左手) でもキー統計を収集し、中央側 (右手) 経由で DYA Studio に返す。
# CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN は左右で同じ値にする必要がある。
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256

#Watchdog -------------------------
# 周辺側 (左手) も自分自身のインシデントを記録する。
# 中央側から中継して DYA Studio の「安定性」タブで
# "Peripheral" を選ぶと参照できる。
CONFIG_ZMK_WATCHDOG=y
